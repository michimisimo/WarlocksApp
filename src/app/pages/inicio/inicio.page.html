<ion-content [scrollY]="false">

  <app-banner-top [activeTab]="activeTab" [tabs]="tabs" [activeOTab]="activeOTab" [oTabs]="oTabs"
    (categorySelected)="filtrarPartidosPorCategoria($event)" (tabChanged)="activeTab = $event"
    (otabChanged)="activeOTab = $event" (abrirConfiguracion)="irACuenta()">
  </app-banner-top>

  <ion-spinner name="bubbles" *ngIf="isLoading" class="loading"></ion-spinner>

  <div class="scroll">

    <div *ngIf="activeTab !== 'Plantel' && activeOTab !== 'Estadisticas'">
      <div *ngIf="partidosFiltrados?.length; else empty">
        <div *ngFor="let partido of partidosFiltrados">

          <app-card-partido [fecha]="(partido.info_global.fecha | date:'dd, MMM, yyyy') || ''"
            [nombreLiga]="'Campeonato Juvenil'" [usuario]="this.user!"
            [equipoLocal]="partido.info_global.local ? 'warloks' : partido.info_global.contrincante"
            [hora]="partido.info_global.hora.substring(0, 5) || ''"
            [equipoVisitante]="!partido.info_global.local ? 'warloks' : partido.info_global.contrincante"
            (verPartido)="verPartido(partido)" (editar)="editarPartido(partido)">

          </app-card-partido>
        </div>
      </div>
      <br>
      <br>
      <br>
      <br>
      <br>
      <br>
      <br>
      <br>
      <div *ngIf="this.user! != null">
        <div *ngIf="this.user!.rol === 'entrenador'">
          <div class="contCrear">
            <button (click)="onCrear()">Crear partido</button>
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="crear===true">
      <app-card-crearpartido (guardado)="onPartidoGuardado($event)" (cancelado)="onCancelarCrearPartido()">
      </app-card-crearpartido>
    </div>

    <div *ngIf=" activeTab !=='Plantel' && activeOTab !=='Partidos'">
      <h2 class=" section-title">–Ataque–</h2>
      <app-est-temporada title="Puntos" [entries]="stats.puntos" [limit]="3"></app-est-temporada>
      <app-est-temporada title="Asistencias" [entries]="stats.asistencias" [limit]="3"></app-est-temporada>

      <!-- Sección Defensa -->
      <h2 class="section-title">–Defensa–</h2>
      <app-est-temporada title="Rebotes" [entries]="stats.rebotes" [limit]="3"></app-est-temporada>
      <app-est-temporada title="Robos" [entries]="stats.robos" [limit]="3"></app-est-temporada>
    </div>


    <div *ngIf="activeTab !== 'Temporada'">
      <app-plantel-tabla title="Dirección" [players]="jugadores" (playerSelected)="onPlayerSelected($event)"
        [categoryFilter]="categoriaActiva" [positionFilter]="'Entrenador'"></app-plantel-tabla>
      <app-plantel-tabla title="Bases" [players]="jugadores" (playerSelected)="onPlayerSelected($event)"
        [categoryFilter]="categoriaActiva" [positionFilter]="'Bases'"></app-plantel-tabla>
      <app-plantel-tabla title="Aleros" [players]="jugadores" (playerSelected)="onPlayerSelected($event)"
        [categoryFilter]="categoriaActiva" [positionFilter]="'Aleros'"></app-plantel-tabla>
      <app-plantel-tabla title="Pivots" [players]="jugadores" (playerSelected)="onPlayerSelected($event)"
        [categoryFilter]="categoriaActiva" [positionFilter]="'Pivots'"></app-plantel-tabla>
    </div>
  </div>

  <ng-template #empty>
    <div *ngIf=" !isLoading && !partidosFiltrados">No hay partidos para mostrar.</div>
  </ng-template>
</ion-content>
