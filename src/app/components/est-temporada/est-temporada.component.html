<!-- src/app/components/stats-table/stats-table.component.html -->
<ion-card class="stats-table">
  <ion-card-header>
    <ion-card-title>{{ title }}</ion-card-title>
  </ion-card-header>

  <ion-list>
    <ion-item *ngFor="let e of visibleEntries">
      <ion-label>
        <h2>{{ e.name }}</h2>
      </ion-label>
      <div slot="end">{{ e.value }}</div>
    </ion-item>

    <ion-item button lines="none" (click)="toggleShowAll()" *ngIf="entries.length > limit">
      <ion-label class="show-all">
        {{ showAllMode ? 'Mostrar menos' : showAllText }}
      </ion-label>
    </ion-item>
  </ion-list>
</ion-card>
