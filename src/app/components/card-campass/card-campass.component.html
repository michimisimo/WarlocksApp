<div class="container">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Cambiar Contraseña</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-grid>
        <ion-row>
          <ion-col size="5" class="label-col">
            <ion-label>Contraseña actual</ion-label>
          </ion-col>
          <ion-col size="7">
            <ion-input type="password" [(ngModel)]="contrasenaActual" name="contrasenaActual"></ion-input>
          </ion-col>
        </ion-row>

        <ion-row>
          <ion-col size="5" class="label-col">
            <ion-label>Nueva contraseña</ion-label>
          </ion-col>
          <ion-col size="7">
            <ion-input [(ngModel)]="nuevaContrasena" name="nuevaContrasena"></ion-input>
          </ion-col>
        </ion-row>

        <ion-row>
          <ion-col size="5" class="label-col">
            <ion-label>validacion contraseña</ion-label>
          </ion-col>
          <ion-col size="7">
            <ion-input [(ngModel)]="confirmarContrasena" name="confirmarContrasena"></ion-input>
          </ion-col>
        </ion-row>
      </ion-grid>

      <div class="boton-cambiar-container">
        <ion-button expand="block" (click)="cambiarContrasena()">Cambiar</ion-button>
      </div>
    </ion-card-content>
  </ion-card>
</div>
