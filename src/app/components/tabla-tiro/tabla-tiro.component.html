<ion-card>
  <ion-card-header>
    <ion-card-title>Tabla de tiro</ion-card-title>
  </ion-card-header>
  <ion-card-content>

    <div class="contenedor">
      <div class="rectangulo1"></div>
      <div class="rectangulo2">
        <div *ngFor="let tiro of lanzamientosFiltrados" class="tiro"
          [ngClass]="{'encestado': tiro.encestado, 'fallado': !tiro.encestado}" [ngStyle]="{
          left: tiro.x + '%',
          top: tiro.y + '%'
        }">
        </div>
      </div>
    </div>

    <div class="segment">
      <ion-segment [value]="filtroCuarto" (ionChange)="cambiarCuarto($event)">
        <ion-segment-button value="Todos">
          <ion-label>Todos</ion-label>
        </ion-segment-button>
        <ion-segment-button value="1C">
          <ion-label>1C</ion-label>
        </ion-segment-button>
        <ion-segment-button value="2C">
          <ion-label>2C</ion-label>
        </ion-segment-button>
        <ion-segment-button value="3C">
          <ion-label>3C</ion-label>
        </ion-segment-button>
        <ion-segment-button value="4C">
          <ion-label>4C</ion-label>
        </ion-segment-button>
        <ion-segment-button value="OT">
          <ion-label>OT</ion-label>
        </ion-segment-button>
      </ion-segment>
    </div>

    <div class="drop">
      <ion-accordion-group>
        <ion-accordion value="filtro-jugador">
          <ion-item slot="header">
            <ion-label><ion-label>{{ filtroJugador }}</ion-label></ion-label>
          </ion-item>
          <div class="ion-padding" slot="content">
            <ion-item button (click)="seleccionarJugador('Todos')">
              <ion-label>Todos</ion-label>
            </ion-item>
            <ion-item button *ngFor="let jugador of jugadores" (click)="seleccionarJugador(jugador)">
              <ion-label>{{ jugador }}</ion-label>
            </ion-item>
          </div>
        </ion-accordion>
      </ion-accordion-group>
    </div>


  </ion-card-content>
</ion-card>
