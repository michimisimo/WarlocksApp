<div class="container">

  <!-- Banner superior con botón atrás y configuración -->
  <div class="banner">

    <div class="space">
      <div class="back" (click)="onClickBack()">
        <img src="../../../assets/icon/arrow_back.png" alt="Volver">
      </div>
      <div class="conf" (click)="onClickConfig()">
        <img src="../../../assets/icon/settings.png" alt="Configuración">
      </div>
    </div>

    <div class="detalle">
      <div class="contrincante">
        <h4>{{equipoVisitante}}</h4>
      </div>
      <div class="date">
        <p>{{ hora }}</p>
        <p>{{ fecha }}</p>
      </div>
      <div class="local">
        <h4>Warlocks</h4>
      </div>
    </div>

  </div>

  <!-- Pestañas principales -->
  <div class="tabs-selection">
    <div *ngFor="let tab of tabs" (click)="cambiarTab(tab)" [class.active-tab]="activeTab === tab" class="tab">
      {{ tab }}
    </div>
  </div>
</div>
